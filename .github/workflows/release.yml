name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.6) — leave empty to auto-bump from latest tag'
        required: false
        type: string

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FORTIVA_ALLOW_UNSIGNED_BRIDGE: '1'
  FORTIVA_BRIDGE_FAST_TEST: '1'

permissions:
  contents: write

jobs:
  prepare:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        shell: bash
        run: |
          set -euo pipefail

          msg="${{ github.event.head_commit.message }}"
          if echo "$msg" | grep -q '\[skip release\]'; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "reason=Commit message contains [skip release]" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            input='${{ inputs.version }}'
            if [ -n "$input" ]; then
              ver="$input"
            else
              latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1 || true)
              if [ -z "$latest" ]; then ver="1.0.0"; else
                core="${latest#v}"
                IFS='.' read -r major minor patch <<< "$core"
                ver="${major}.${minor}.$((patch + 1))"
              fi
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$ver" >> "$GITHUB_OUTPUT"
            echo "reason=Manual workflow dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$ver" >> "$GITHUB_OUTPUT"
            echo "reason=Tag push $GITHUB_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Push to main — auto-release when HEAD is not already the latest tag commit
          git fetch --tags --force
          head=$(git rev-parse HEAD)
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1 || true)

          if [ -n "$latest" ]; then
            tag_commit=$(git rev-parse "${latest}^{commit}")
            if [ "$tag_commit" = "$head" ]; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "reason=HEAD already released as $latest" >> "$GITHUB_OUTPUT"
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            core="${latest#v}"
            IFS='.' read -r major minor patch <<< "$core"
            ver="${major}.${minor}.$((patch + 1))"
          else
            ver="1.0.0"
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "reason=New commits on main since $latest — auto release $ver" >> "$GITHUB_OUTPUT"

  release:
    name: Build, test, publish GitHub Release
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log release plan
        shell: pwsh
        run: |
          Write-Host "Release version: ${{ needs.prepare.outputs.version }}"
          Write-Host "Reason: ${{ needs.prepare.outputs.reason }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Restore and build tests
        run: |
          dotnet restore tests/Fortiva.Core.Tests/Fortiva.Core.Tests.csproj
          dotnet build tests/Fortiva.Core.Tests/Fortiva.Core.Tests.csproj -c Release --no-restore

      - name: Stop Fortiva before tests
        shell: pwsh
        run: |
          Get-Process -Name 'Fortiva.Personal','Fortiva.Enterprise','Fortiva.AppHost','Fortiva.BrowserBridge.Host' -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Run Core unit tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 20
          shell: pwsh
          command: >
            dotnet test tests/Fortiva.Core.Tests/Fortiva.Core.Tests.csproj
            -c Release --no-build --verbosity normal
            -- xunit.parallelizeTestCollections=false

      - name: Run AppHost unit tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 20
          shell: pwsh
          command: >
            dotnet restore tests/Fortiva.AppHost.Tests/Fortiva.AppHost.Tests.csproj;
            dotnet build tests/Fortiva.AppHost.Tests/Fortiva.AppHost.Tests.csproj -c Release --no-restore;
            dotnet test tests/Fortiva.AppHost.Tests/Fortiva.AppHost.Tests.csproj
            -c Release --no-build --verbosity normal
            -- xunit.parallelizeTestCollections=false

      - name: Build release (dist/)
        shell: pwsh
        run: ./build-release.ps1 -Version ${{ needs.prepare.outputs.version }}

      - name: Pack browser extension CRX (Enterprise force-install)
        shell: pwsh
        env:
          EXTENSION_PRIVATE_KEY_PEM: ${{ secrets.EXTENSION_PRIVATE_KEY_PEM }}
        run: ./scripts/pack-extension-crx.ps1 -Version ${{ needs.prepare.outputs.version }}

      # Authenticode signing — no-op until CODESIGN_PFX_* secrets exist (script self-skips).
      # Personal ships unsigned today; see docs/CODESIGNING.md. When secrets are set, EXEs are
      # signed before installers bundle them; installers are signed before manifest hashing.
      - name: Sign published executables
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
          CODESIGN_TIMESTAMP_URL: ${{ secrets.CODESIGN_TIMESTAMP_URL }}
        run: ./scripts/sign-release-artifacts.ps1 -Stage Published

      - name: Build installers
        shell: pwsh
        run: ./build-installers.ps1 -Version ${{ needs.prepare.outputs.version }}
        timeout-minutes: 30

      - name: Installer QA gate
        shell: pwsh
        run: ./scripts/Test-InstallerQa.ps1 -Version ${{ needs.prepare.outputs.version }}

      - name: Bridge release tests (serial)
        shell: pwsh
        run: |
          Get-Process -Name 'Fortiva.Personal','Fortiva.BrowserBridge.Host' -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          dotnet test tests/Fortiva.Core.Tests/Fortiva.Core.Tests.csproj -c Release --no-build `
            --filter "FullyQualifiedName~BrowserBridgeEndToEnd|FullyQualifiedName~BridgeUnlockBrokerPipe|FullyQualifiedName~BridgeInstallIntegrity" `
            --verbosity minimal -- xunit.parallelizeTestCollections=false
        timeout-minutes: 10

      - name: Sign installers
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
          CODESIGN_TIMESTAMP_URL: ${{ secrets.CODESIGN_TIMESTAMP_URL }}
        run: ./scripts/sign-release-artifacts.ps1 -Stage Installers

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $v = '${{ needs.prepare.outputs.version }}'
          $installer = "dist/installers/FortivaPersonal-$v-Setup.exe"
          if (-not (Test-Path $installer)) { throw "Missing installer: $installer" }
          $sizeMb = [math]::Round((Get-Item $installer).Length / 1MB, 1)
          if ($sizeMb -lt 20) { throw "Installer too small ($sizeMb MB): $installer" }
          Write-Host "Verified $installer ($sizeMb MB)"

      - name: Generate update manifest
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/publish-release-manifest.ps1 -Version ${{ needs.prepare.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Fortiva ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            dist/installers/FortivaPersonal-${{ needs.prepare.outputs.version }}-Setup.exe
            packaging/releases/latest.personal.json
            dist/installers/FortivaEnterprise-${{ needs.prepare.outputs.version }}-Setup.exe
            dist/installers/FortivaAdmin-${{ needs.prepare.outputs.version }}-Setup.exe
            dist/extension/FortivaAutofill.crx
            dist/extension/fortiva-extension-updates.xml

      - name: Sync version files on main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $v = '${{ needs.prepare.outputs.version }}'
          & ./scripts/bump-version.ps1 -Set -Version $v | Out-Null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Directory.Build.props extension/manifest.json packaging/releases/latest.personal.json
          if (git diff --cached --quiet) { Write-Host "Version files already match $v"; exit 0 }
          git commit -m "chore(release): sync version to $v [skip release]"
          git push origin HEAD:main

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fortiva-${{ needs.prepare.outputs.version }}
          retention-days: 90
          path: |
            dist/installers/*.exe
            packaging/releases/latest.personal.json
