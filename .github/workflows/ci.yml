name: Fortiva CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FORTIVA_ALLOW_UNSIGNED_BRIDGE: '1'
  FORTIVA_BRIDGE_FAST_TEST: '1'

jobs:
  # ── Core library + tests (runs on every push) ───────────────────────────────
  core:
    name: Core — build, test, analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore packages
        run: dotnet restore src/Fortiva.Core/Fortiva.Core.csproj

      - name: Build Core
        run: dotnet build src/Fortiva.Core/Fortiva.Core.csproj -c Release --no-restore

      - name: Restore test packages
        run: dotnet restore tests/Fortiva.Core.Tests/Fortiva.Core.Tests.csproj

      - name: Build tests
        run: dotnet build tests/Fortiva.Core.Tests/Fortiva.Core.Tests.csproj -c Release --no-restore

      - name: Stop Fortiva before Core tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Process -Name 'Fortiva.Personal','Fortiva.Enterprise','Fortiva.AppHost','Fortiva.BrowserBridge.Host' -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Run tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 20
          shell: pwsh
          command: >
            dotnet test tests/Fortiva.Core.Tests/Fortiva.Core.Tests.csproj
            -c Release --no-build
            --logger "trx;LogFileName=core-tests.trx"
            --logger "console;verbosity=normal"
            -- xunit.parallelizeTestCollections=false

      - name: Restore AppHost tests
        run: dotnet restore tests/Fortiva.AppHost.Tests/Fortiva.AppHost.Tests.csproj

      - name: Build AppHost tests
        run: dotnet build tests/Fortiva.AppHost.Tests/Fortiva.AppHost.Tests.csproj -c Release --no-restore

      - name: Run AppHost tests
        run: >
          dotnet test tests/Fortiva.AppHost.Tests/Fortiva.AppHost.Tests.csproj
          -c Release --no-build --verbosity normal

      - name: Run bridge security unit tests
        run: >
          dotnet test tests/Fortiva.Core.Tests/Fortiva.Core.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~BridgeNativeForwarder|FullyQualifiedName~BridgeAppLauncher|FullyQualifiedName~BridgeFillNonce|FullyQualifiedName~BridgePingClassifier|FullyQualifiedName~DomainSafety|FullyQualifiedName~VaultEntryWebsite"

      - name: Validate extension manifest
        shell: pwsh
        run: ./scripts/Test-ExtensionManifest.ps1

      - name: Publish Personal + bridge (smoke)
        run: |
          dotnet publish src/Fortiva.Personal/Fortiva.Personal.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=false -o $env:RUNNER_TEMP/Fortiva.Personal -v q
          dotnet publish src/Fortiva.BrowserBridge.Host/Fortiva.BrowserBridge.Host.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=false -o $env:RUNNER_TEMP/BrowserBridge -v q

  # ── Installer QA (Inno Setup + bridge hash sidecar) ─────────────────────────
  installer-qa:
    name: Installer — build + QA gate
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build release dist
        shell: pwsh
        run: ./build-release.ps1
        timeout-minutes: 25

      - name: Restore and build tests
        run: |
          dotnet restore tests/Fortiva.Core.Tests/Fortiva.Core.Tests.csproj
          dotnet build tests/Fortiva.Core.Tests/Fortiva.Core.Tests.csproj -c Release --no-restore

      - name: Run installer QA gate
        shell: pwsh
        run: ./scripts/Test-InstallerQa.ps1

      - name: Bridge e2e tests (serial)
        shell: pwsh
        run: |
          Get-Process -Name 'Fortiva.Personal','Fortiva.BrowserBridge.Host' -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          dotnet test tests/Fortiva.Core.Tests/Fortiva.Core.Tests.csproj -c Release --no-build `
            --filter "FullyQualifiedName~BrowserBridgeEndToEnd|FullyQualifiedName~BridgeUnlockBrokerPipe" `
            --verbosity minimal -- xunit.parallelizeTestCollections=false

      - name: Upload Personal installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-qa-personal
          retention-days: 14
          path: dist/installers/FortivaPersonal-*-Setup.exe

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: "**/*.trx"

      - name: Roslyn analyzer
        run: |
          dotnet build src/Fortiva.Core/Fortiva.Core.csproj `
            -c Release --no-restore `
            /p:EnableNETAnalyzers=true `
            /p:AnalysisMode=All `
            /p:TreatWarningsAsErrors=false `
            /warnaserror:CS8600,CS8602,CS8603,CS8604

  # ── License tool (dotnet CLI, no VS required) ───────────────────────────────
  license-tool:
    name: LicenseTool — build + smoke test
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet build src/Fortiva.LicenseTool/Fortiva.LicenseTool.csproj -c Release
      - name: Smoke test — generate key
        run: dotnet run --project src/Fortiva.LicenseTool/Fortiva.LicenseTool.csproj -- generate-key
        continue-on-error: false

  # ── Browser bridge host ──────────────────────────────────────────────────────
  browser-bridge:
    name: BrowserBridge.Host — build
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet build src/Fortiva.BrowserBridge.Host/Fortiva.BrowserBridge.Host.csproj -c Release

  # ── WinUI applications (requires VS workload; continue-on-error) ────────────
  winui:
    name: WinUI apps — build (VS)
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Restore WinUI apps
        run: |
          dotnet restore src/Fortiva.AppHost/Fortiva.AppHost.csproj
          dotnet restore src/Fortiva.Personal/Fortiva.Personal.csproj
          dotnet restore src/Fortiva.Enterprise/Fortiva.Enterprise.csproj
          dotnet restore src/Fortiva.Admin/Fortiva.Admin.csproj
      - name: Build Fortiva.Personal
        run: dotnet build src/Fortiva.Personal/Fortiva.Personal.csproj -c Release -p:Platform=x64 --no-restore
      - name: Build Fortiva.Enterprise
        run: dotnet build src/Fortiva.Enterprise/Fortiva.Enterprise.csproj -c Release -p:Platform=x64 --no-restore
      - name: Build Fortiva.Admin
        run: dotnet build src/Fortiva.Admin/Fortiva.Admin.csproj -c Release -p:Platform=x64 --no-restore

  # ── Security scan ────────────────────────────────────────────────────────────
  security:
    name: Security — CodeQL
    runs-on: windows-latest
    needs: core
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-extended
      - name: Build for CodeQL
        run: |
          dotnet build src/Fortiva.Core/Fortiva.Core.csproj -c Release
          dotnet build src/Fortiva.LicenseTool/Fortiva.LicenseTool.csproj -c Release
          dotnet build src/Fortiva.BrowserBridge.Host/Fortiva.BrowserBridge.Host.csproj -c Release
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  # ── Summary status check ─────────────────────────────────────────────────────
  all-clear:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [core, license-tool, browser-bridge, winui, security, installer-qa]
    steps:
      - run: echo "All required CI checks passed."
