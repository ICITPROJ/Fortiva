ShortDescription: Zero-knowledge, local-first Windows password manager
Description: >-
  Fortiva is a zero-knowledge, local-first password manager for Windows.
  All encryption (AES-256-GCM + Argon2id) happens on-device using Windows CNG.
  No cloud sync. No telemetry. No background services.
  Supports Windows Hello biometric unlock, browser autofill (Edge/Chrome),
  secure notes, password health reports, and portable USB mode.

